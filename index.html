<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Open Scad</title>
<script type="importmap">
{"imports":{"three":"./vendor/three/three.module.js"}}
</script>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest?v=7">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Open Scad">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<meta name="description" content="Open Scad model maker for mobile. Paste or upload code, tweak parameters, export 3MF.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Open Scad">
<meta property="og:title" content="Open Scad">
<meta property="og:description" content="Open Scad model maker for mobile. Paste or upload code, tweak parameters, export 3MF.">
<meta property="og:url" content="https://yanai-lez.github.io/Open-Scad/">
<meta property="og:image" content="https://yanai-lez.github.io/Open-Scad/og-image.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="600">
<meta property="og:image:height" content="600">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Open Scad">
<meta name="twitter:description" content="Open Scad model maker for mobile.">
<meta name="twitter:image" content="https://yanai-lez.github.io/Open-Scad/og-image.jpg">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">

</head>
<body>
<header>
  <img class="logo" src="logo.png" alt="" width="32" height="32">
  <h1>Open Scad</h1>
  <select id="plateSel" style="display:none"></select>
  <button id="btnRender" class="pri">Update</button>
  <button id="btnDl" disabled>3MF</button>
</header>
<main>
  <section id="params" class="pane"><div id="plist"></div></section>
  <section id="codepane" class="pane">
    <div class="bar">
      <button id="btnUp">Upload file</button>
      <button id="btnPaste">Paste</button>
      <button id="btnClear">Clear</button>
      <button id="btnFind">Find</button>
      <button id="btnLib">Library</button>
      <button id="btnShare" hidden>Share</button>
      <button id="btnSave">Save .scad</button>
      <input id="file" type="file" style="display:none">
    </div>
    <div id="findbar" hidden>
      <input id="findIn" type="text" placeholder="Find" autocomplete="off" autocapitalize="off" spellcheck="false">
      <select id="findMode"><option value="text">Text</option><option value="line">Line</option></select>
      <button id="findPrev">↑</button><button id="findNext">↓</button><span id="findCount"></span><button id="findClose">✕</button>
    </div>
    <div class="editor"><pre id="syntax" aria-hidden="true"></pre><textarea id="code" placeholder="Paste OpenSCAD code here, or upload a .scad file" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea></div>
  </section>
  <section id="view" class="pane"><canvas id="cv"></canvas><div id="status">Loading…</div></section>
</main>
<nav>
  <button data-t="codepane" class="on">Code</button>
  <button data-t="params">Parameters</button>
  <button data-t="view">Preview</button>
</nav>

<dialog id="libDlg"><h2>Library</h2><ul id="libList"></ul><button id="libClose">Close</button></dialog>
<div id="toast" hidden></div>
<script type="module" src="app.js"></script>
<script type="module" src="editor.js"></script>
</body>
</html>
